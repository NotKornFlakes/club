<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club events – Admin – [Club name]</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/admin/events.js"></script>
</head>
<body class="admin">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <nav aria-label="Admin">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/members">Members</a>
      <a href="/admin/schedule">Schedule</a>
      <a href="/admin/leagues">Leagues</a>
      <a href="/admin/resources">Courts & rooms</a>
      <a href="/admin/events" aria-current="page">Club events</a>
      <a href="/admin/audit">Audit log</a>
      <button type="button" class="link-button" data-logout>Log out</button>
    </nav>
  </header>
  <div id="alarm-banner" class="alarm-banner" role="alert" hidden></div>
  <main id="main">
    <h1>Club events</h1>
    <p class="lead">Events at other places. Members see them on their Club events page.</p>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>
    <div id="events"></div>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Add an event</h2>
      <form id="event-form" novalidate>
        <label for="title">Title</label>
        <input id="title" maxlength="120" required>
        <label for="location">Where</label>
        <input id="location" maxlength="120" required>
        <label for="details">Details (optional)</label>
        <textarea id="details" maxlength="2000" rows="3"></textarea>
        <div class="two-col">
          <div><label for="start-date">Start date</label><input id="start-date" type="date" required></div>
          <div><label for="start-time">Start time</label><input id="start-time" type="time" required></div>
          <div><label for="end-date">End date</label><input id="end-date" type="date" required></div>
          <div><label for="end-time">End time</label><input id="end-time" type="time" required></div>
        </div>
        <div class="actions">
          <button type="submit" class="button" id="save-event">Add event</button>
          <button type="button" class="button button-secondary" id="cancel-edit" hidden>Stop editing</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
