<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-club-title>Audit log – Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/club.css">
  <script type="module" src="/js/admin/audit.js"></script>
</head>
<body class="admin">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <nav aria-label="Admin">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/members">Members</a>
      <a href="/admin/schedule">Schedule</a>
      <a href="/admin/leagues">Leagues</a>
      <a href="/admin/resources">Courts & rooms</a>
      <a href="/admin/events">Club events</a>
      <a href="/admin/audit" aria-current="page">Audit log</a>
      <button type="button" class="link-button" data-logout>Log out</button>
    </nav>
  </header>
  <div id="alarm-banner" class="alarm-banner" role="alert" hidden></div>
  <main id="main">
    <h1>Audit log</h1>
    <p class="lead">Every admin action, newest first. Entries are kept for 24 months and can't be edited.</p>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th><th scope="col">Details</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p><button type="button" class="button button-secondary" id="more" hidden>Show older entries</button></p>
  </main>
</body>
</html>
