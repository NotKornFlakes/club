<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courts and rooms – Admin – [Club name]</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/admin/resources.js"></script>
</head>
<body class="admin">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <nav aria-label="Admin">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/members">Members</a>
      <a href="/admin/schedule">Schedule</a>
      <a href="/admin/leagues">Leagues</a>
      <a href="/admin/resources" aria-current="page">Courts & rooms</a>
      <a href="/admin/events">Club events</a>
      <a href="/admin/audit">Audit log</a>
      <button type="button" class="link-button" data-logout>Log out</button>
    </nav>
  </header>
  <div id="alarm-banner" class="alarm-banner" role="alert" hidden></div>
  <main id="main">
    <h1>Courts and rooms</h1>
    <p class="lead">Opening hours are in club time (New York). Write each day's hours like
      <code>09:00-12:00, 14:00-20:00</code>, on the quarter hour. Leave a day empty when it's closed.</p>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>
    <div id="resources"></div>
    <section aria-labelledby="new-title">
      <h2 id="new-title">Add a court or room</h2>
      <form id="new-form" class="inline-form" novalidate>
        <label for="new-name">Name</label>
        <input id="new-name" maxlength="60" required>
        <button type="submit" class="button">Add</button>
      </form>
    </section>
  </main>
</body>
</html>
