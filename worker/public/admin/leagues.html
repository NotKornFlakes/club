<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leagues – Admin – [Club name]</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/admin/leagues.js"></script>
</head>
<body class="admin">
  <header class="topbar">
    <nav aria-label="Admin">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/members">Members</a>
      <a href="/admin/schedule">Schedule</a>
      <a href="/admin/leagues" aria-current="page">Leagues</a>
      <a href="/admin/resources">Courts & rooms</a>
      <a href="/admin/events">Club events</a>
      <a href="/admin/audit">Audit log</a>
      <button type="button" class="link-button" data-logout>Log out</button>
    </nav>
  </header>
  <div id="alarm-banner" class="alarm-banner" role="alert" hidden></div>
  <main>
    <h1>Leagues</h1>
    <p class="lead">A league books the same time every week for one season (at most 12 months).
      Dates that clash with an existing booking are skipped and listed.</p>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>
    <section id="result" class="card" hidden aria-live="polite"></section>
    <h2>Seasons</h2>
    <div id="leagues"></div>
    <section aria-labelledby="new-title">
      <h2 id="new-title">New league season</h2>
      <form id="league-form" novalidate>
        <label for="name">League name</label>
        <input id="name" maxlength="80" required>
        <label for="resource">Court or room</label>
        <select id="resource"></select>
        <label for="weekday">Day of the week</label>
        <select id="weekday">
          <option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option>
          <option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>
        <div class="two-col">
          <div><label for="starts">Start time</label><input id="starts" type="time" step="900" required></div>
          <div><label for="ends">End time</label><input id="ends" type="time" step="900" required></div>
          <div><label for="first">First date</label><input id="first" type="date" required></div>
          <div><label for="last">Last date</label><input id="last" type="date" required></div>
        </div>
        <button type="submit" class="button">Create season</button>
      </form>
    </section>
  </main>
</body>
</html>
