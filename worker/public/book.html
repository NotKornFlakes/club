<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-club-title>Book a time</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/club.css">
  <script src="/js/early.js"></script>
  <script type="module" src="/js/site.js"></script>
  <script type="module" src="/js/week.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header data-site-header></header>
  <nav class="member-bar" aria-label="Members">
    <a href="/app">My bookings</a>
    <a href="/book" aria-current="page">Book</a>
    <a href="/events">Club events</a>
    <button type="button" class="link-button" data-logout>Log out</button>
  </nav>
  <main id="main" class="full">
    <h1>Book a time</h1>
    <p class="lead">You can book up to <span data-club="days_ahead"></span> ahead, in 15-minute
      blocks, for up to <span data-club="max_length"></span>. Tap a free time to book it.</p>
    <div id="suspended" class="message message-error" role="status" hidden></div>
    <p id="login-note" class="message message-info" hidden>Members can book any free time.
      <a class="button" id="login-link" href="/login?next=/book">Log in to book</a></p>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>
    <section id="week" class="week" data-mode="book" aria-label="Week view">
      <p class="week-empty">Loading the week…</p>
    </section>
  </main>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <footer data-site-footer></footer>
</body>
</html>
