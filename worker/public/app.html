<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings – [Club name]</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <nav aria-label="Main">
      <a href="/app" aria-current="page">My bookings</a>
      <a href="/book">Book</a>
      <a href="/events">Club events</a>
      <button type="button" class="link-button" data-logout>Log out</button>
    </nav>
  </header>
  <main>
    <h1>My bookings</h1>
    <p class="lead">Member <strong id="member-number">…</strong></p>
    <div id="suspended" class="message message-error" role="status" hidden></div>
    <p id="message" class="message" role="alert" tabindex="-1" hidden></p>

    <p><a class="button button-wide" href="/book" id="book-link">Book a time</a></p>

    <h2>Coming up</h2>
    <div id="bookings" aria-live="polite"><p class="help">Loading…</p></div>
    <p class="help">You can have up to 2 upcoming bookings. Bookings can be cancelled up to
      24 hours before they start.</p>
  </main>
  <footer>
    <a href="/rules">Booking rules</a>
  </footer>
</body>
</html>
