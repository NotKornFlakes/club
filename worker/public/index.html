<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-club-title>Welcome</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/club.css">
  <script src="/js/early.js"></script>
  <script type="module" src="/js/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header data-site-header></header>
  <section class="hero" data-club-hero aria-labelledby="club-name">
    <div class="hero-inner">
      <div data-club-crest></div>
      <h1 id="club-name" data-club="name"></h1>
      <p class="hero-since" data-club="since"></p>
      <p class="hero-motto" data-club="motto"></p>
      <div class="hero-actions">
        <a class="button button-gold" href="/week">See this week</a>
        <a class="button button-secondary" href="/book">Book a time</a>
      </div>
    </div>
  </section>
  <main id="main" class="wide">
    <div class="prose" data-club-content="home"></div>
  </main>
  <footer data-site-footer></footer>
</body>
</html>
