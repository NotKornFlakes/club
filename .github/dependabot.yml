# Keeps pinned actions, npm dev tools and the Terraform provider up to date.
# Each update arrives as a PR that goes through CI and your review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release. Malicious releases are usually
    # spotted and pulled within days, so a delay means never being among the first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "infra"
