name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      # persist-credentials: false keeps the GitHub token out of .git/config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Exact versions from package-lock.json. Only esbuild and workerd may run
      # install scripts (allowScripts in package.json).
      - name: Install
        run: npm ci --no-fund

      - name: Known vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Code rules
        run: npm run rules

      - name: Type check (// @ts-check + JSDoc)
        run: npm run typecheck

      # Runs in the real Workers runtime against a local D1 with the migrations applied
      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same Terraform version in CI, plan and apply; bump it on purpose
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      # validate reads the bundle's hash, so give it an empty stand-in
      - name: Validate
        run: |
          mkdir -p ../worker/dist
          touch ../worker/dist/index.js
          terraform validate

      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: .
          framework: terraform,github_actions
          soft_fail: false

      - name: Workflow security scan (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so a secret committed and then deleted is still found
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Fails the PR if it adds a dependency with a known high-severity vulnerability
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
